services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: edildy
      POSTGRES_USER: edildy_owner
      POSTGRES_PASSWORD: owner_dev_password
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edildy_owner -d edildy']
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports: ['8333:8333']
    volumes:
      - seaweedfsdata:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
  # One-off: creates the private bucket and sets its CORS rule for the web dev origins; restarts until SeaweedFS answers.
  seaweedfs-init:
    image: amazon/aws-cli:latest
    depends_on: [seaweedfs]
    restart: on-failure
    environment:
      AWS_ACCESS_KEY_ID: edildy
      AWS_SECRET_ACCESS_KEY: edildy_dev_password
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/seaweedfs/cors.json:/etc/seaweedfs/cors.json:ro
    entrypoint:
      - sh
      - -c
      - >-
        (aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket edildy-media
        || aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket edildy-media)
        && aws --endpoint-url http://seaweedfs:8333 s3api put-bucket-cors --bucket edildy-media --cors-configuration file:///etc/seaweedfs/cors.json
volumes:
  pgdata: {}
  seaweedfsdata: {}
