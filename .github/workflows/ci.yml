name: CI
on:
  # Branches run through their pull request; pushing to a PR branch would otherwise run every job twice.
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
  # Each suite on its own runner, so they don't compete for CPU with each other and the API's Postgres container.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: api, filter: '@edildy/api' }
          - { name: web, filter: '@edildy/web' }
          - { name: mobile, filter: '@edildy/mobile' }
          - { name: landing, filter: '@edildy/landing' }
          - { name: packages, filter: './packages/*' }
    name: test (${{ matrix.suite.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test --filter='${{ matrix.suite.filter }}'
  # The production images (landing, web, api), built the way the deploy builds them, and the landing page checked
  # once: the page answers and its Login link points at the platform.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Placeholder secrets for the compose file
        run: |
          cp deploy/.env.example deploy/.env
          for k in OWNER_DB_PASSWORD APP_DB_PASSWORD PLATFORM_DB_PASSWORD S3_SECRET_KEY JWT_PRIVATE_KEY JWT_PUBLIC_KEY; do
            sed -i "s|^$k=.*|$k=ci|" deploy/.env
          done
      - run: docker compose -f deploy/docker-compose.prod.yml config --quiet
      - run: docker compose -f deploy/docker-compose.prod.yml build landing web api
      - name: Smoke test the image
        run: |
          docker run -d --name landing -p 8080:80 ghcr.io/sahmadpur/edildy-landing:latest
          for i in $(seq 1 15); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q 'href="https://admin.edildy.com/login"'
          curl -fsSI http://localhost:8080/en/ | grep -i '^cache-control: public, max-age=300'
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [checks, test]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: edildy
          POSTGRES_USER: edildy_owner
          POSTGRES_PASSWORD: owner_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edildy_owner -d edildy" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_OWNER_URL: postgres://edildy_owner:owner_ci_password@localhost:5432/edildy
      DATABASE_APP_URL: postgres://edildy_app:app_ci_password@localhost:5432/edildy
      DATABASE_PLATFORM_URL: postgres://edildy_platform:platform_ci_password@localhost:5432/edildy
      APP_DB_PASSWORD: app_ci_password
      PLATFORM_DB_PASSWORD: platform_ci_password
      WEB_URL: http://localhost:5173
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: Edildy <no-reply@edildy.ci>
      COOKIE_SECURE: 'false'
      LOG_LEVEL: warn
      # SeaweedFS and Mailpit run as containers (step below): the audit report is stored there and mailed (SP8).
      S3_ENDPOINT: http://localhost:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY: edildy
      S3_SECRET_KEY: edildy_dev_password
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start object storage and the mail catcher
        env:
          AWS_ACCESS_KEY_ID: edildy
          AWS_SECRET_ACCESS_KEY: edildy_dev_password
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d --name seaweedfs -p 8333:8333 -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs:latest server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
          for i in $(seq 1 30); do
            aws --endpoint-url http://localhost:8333 s3api head-bucket --bucket edildy-media 2>/dev/null && break
            aws --endpoint-url http://localhost:8333 s3api create-bucket --bucket edildy-media 2>/dev/null && break
            sleep 2
          done
          aws --endpoint-url http://localhost:8333 s3api head-bucket --bucket edildy-media
      - name: Prepare database and JWT keys
        run: |
          cd apps/api
          touch .env
          pnpm exec tsx src/db/scripts/setup.ts
          pnpm exec tsx src/db/scripts/seed.ts
          # Organisations are created by Edildy staff only: the specs sign in as this platform admin (e2e/org.ts).
          PLATFORM_ADMIN_EMAIL=e2e-admin@edildy.test PLATFORM_ADMIN_NAME='E2E Admin' PLATFORM_ADMIN_PASSWORD='e2e platform password' pnpm exec tsx src/scripts/create-platform-admin.ts
          pnpm exec tsx src/scripts/generate-keys.ts | sed 's/"//g' >> "$GITHUB_ENV"
      - run: pnpm --filter @edildy/web exec playwright install --with-deps chromium
      - run: pnpm --filter @edildy/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
